<!doctype html>
<html lang="es">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1">
  <title>QA responsive · v0.10.1-Beta-Patch</title>
  <style>
    :root{font-family:system-ui,sans-serif;color:#111827;background:#e9e2d6}
    *{box-sizing:border-box}
    body{margin:0;padding:24px}
    h1{margin:0 0 8px;font-size:28px}
    p{margin:0 0 20px;color:#4b5563}
    .grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(340px,1fr));gap:20px;align-items:start}
    article{background:#fffaf0;border:3px solid #111827;padding:14px;box-shadow:8px 8px 0 #ff6900;overflow:auto}
    h2{font-size:18px;margin:0 0 12px}
    iframe{display:block;border:2px solid #111827;background:white;max-width:none}
    pre{white-space:pre-wrap;background:#111827;color:#fff;padding:12px;min-height:116px;margin:12px 0 0;font-size:12px}
  </style>
</head>
<body>
  <h1>QA responsive · v0.10.1-Beta-Patch</h1>
  <p>Comprobación temporal de desbordamiento documental en móvil, horizontal y escritorio.</p>
  <main class="grid">
    <article><h2>Móvil · 320 × 568</h2><iframe id="mobile" title="Móvil 320 por 568" width="320" height="568" src="v0.10.1-Beta-Patch.html?debug=1#calculadora"></iframe><pre id="mobileResult">Cargando…</pre></article>
    <article><h2>Horizontal · 812 × 375</h2><iframe id="landscape" title="Horizontal 812 por 375" width="812" height="375" src="v0.10.1-Beta-Patch.html?debug=1#calculadora"></iframe><pre id="landscapeResult">Cargando…</pre></article>
    <article><h2>Escritorio · 1366 × 768</h2><iframe id="desktop" title="Escritorio 1366 por 768" width="1366" height="768" src="v0.10.1-Beta-Patch.html?debug=1#calculadora"></iframe><pre id="desktopResult">Cargando…</pre></article>
  </main>
  <script>
    ['mobile','landscape','desktop'].forEach(function(id){
      const frame=document.getElementById(id),output=document.getElementById(id+'Result');
      frame.addEventListener('load',function(){
        window.setTimeout(function(){
          try{
            const win=frame.contentWindow,doc=frame.contentDocument,root=doc.documentElement,body=doc.body;
            const menu=doc.getElementById('menuButton'),nav=doc.getElementById('mainNav');
            const result={
              viewport:win.innerWidth+' × '+win.innerHeight,
              documentWidth:Math.max(root.scrollWidth,body.scrollWidth),
              clientWidth:root.clientWidth,
              horizontalOverflow:Math.max(root.scrollWidth,body.scrollWidth)>root.clientWidth+1,
              menuVisible:menu ? getComputedStyle(menu).display!=='none' : false,
              navMode:nav ? (getComputedStyle(nav).position==='fixed' ? 'mobile' : 'desktop') : 'missing',
              version:(doc.body.innerText.match(/v0\.10\.1-Beta-Patch/)||[])[0]||'missing'
            };
            output.textContent=JSON.stringify(result,null,2);
            output.dataset.status=result.horizontalOverflow||result.version==='missing'?'FAIL':'PASS';
          }catch(error){output.textContent='ERROR: '+error.message;output.dataset.status='FAIL';}
        },1200);
      });
    });
  </script>
</body>
</html>
